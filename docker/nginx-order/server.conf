# Mock order upstream cho kiểm thử nhúng $upstream_* qua nginx.
# Không gọi API thật / không dump-login.

server {
    listen       127.0.0.1:18080;
    server_name  localhost;

    # Biến nhúng ngx_http_upstream_module — log_format
    access_log /workspace/docker/nginx-order/logs/order_access.log order_upstream;
    error_log  /workspace/docker/nginx-order/logs/order_error.log warn;

    # Health
    location = /health {
        default_type application/json;
        return 200 '{"ok":true,"service":"nginx-order-embed"}';
    }

    # Gọi đơn qua upstream — nhúng biến vào response header để script kiểm thử
    location /orders {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;

        proxy_pass http://order_backend;

        # Embedded upstream vars → client (kiểm thử)
        add_header X-Upstream-Addr            $upstream_addr always;
        add_header X-Upstream-Status          $upstream_status always;
        add_header X-Upstream-Response-Time   $upstream_response_time always;
        add_header X-Upstream-Connect-Time    $upstream_connect_time always;
        add_header X-Upstream-Header-Time     $upstream_header_time always;
        add_header X-Upstream-Bytes-Received  $upstream_bytes_received always;
        add_header X-Upstream-Bytes-Sent      $upstream_bytes_sent always;
        add_header X-Upstream-Response-Length $upstream_response_length always;
        add_header X-Upstream-Cache-Status    $upstream_cache_status always;
        add_header X-Order-Via                "nginx-embed" always;
    }

    location /order/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_pass http://order_backend;
        add_header X-Upstream-Addr $upstream_addr always;
        add_header X-Upstream-Status $upstream_status always;
        add_header X-Upstream-Response-Time $upstream_response_time always;
        add_header X-Order-Via "nginx-embed" always;
    }

    location / {
        default_type text/plain;
        return 200 "nginx-order-embed · GET /orders · GET /health\n";
    }
}
