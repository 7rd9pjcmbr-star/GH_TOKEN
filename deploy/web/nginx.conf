### Mã Mở — production static web tier (nginx)
### Serves the static UI (/, /atlas/, /mapper/, /logic-view/, /lab/).
### Used by deploy/web/Dockerfile. Runs as the nginx master + worker in the container.

user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log  warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  30;
    server_tokens   off;

    # Structured access log
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" rt=$request_time';
    access_log  /var/log/nginx/access.log  main;

    # --- Compression ---
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/javascript application/javascript
                      application/json image/svg+xml application/manifest+json;

    server {
        listen       80;
        listen       [::]:80;
        server_name  _;

        root   /usr/share/nginx/html;
        index  index.html;
        charset utf-8;

        # --- Security headers (applied to every response) ---
        add_header X-Content-Type-Options    "nosniff"            always;
        add_header X-Frame-Options           "SAMEORIGIN"         always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin"       always;
        # Compatible CSP: self scripts, inline+Google-Fonts styles, data: images, self workers.
        # The /lab/ page ships an even stricter meta CSP; both are enforced (intersection).
        add_header Content-Security-Policy    "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

        # --- Health endpoint for load balancers / orchestrators ---
        location = /healthz {
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        # --- Long-lived caching for immutable static assets ---
        # Use `expires` (not add_header) so the server-level security headers above
        # are still inherited here — an add_header inside a location cancels them.
        location ~* \.(?:js|css|woff2?|ttf|eot|otf|svg|png|jpg|jpeg|gif|ico|webp|json)$ {
            expires 1h;
            try_files $uri =404;
        }

        # --- App routing: serve directory index.html, 404 otherwise ---
        location / {
            expires -1;
            try_files $uri $uri/ =404;
        }

        # Never serve server-side / secret material even if copied in by mistake
        location ~ /\.(?!well-known) { deny all; }
        location ~* /(scripts|secrets|quarantine|reports|docker)/ { deny all; }
    }
}
