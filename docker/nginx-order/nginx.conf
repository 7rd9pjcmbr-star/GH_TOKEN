worker_processes  1;
daemon off;
error_log  /workspace/docker/nginx-order/logs/nginx_error.log warn;
pid        /workspace/docker/nginx-order/tmp/nginx.pid;

events {
    worker_connections  64;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/json;
    sendfile        on;
    keepalive_timeout  15;

    client_body_temp_path /workspace/docker/nginx-order/client_body;
    proxy_temp_path       /workspace/docker/nginx-order/proxy;
    fastcgi_temp_path     /workspace/docker/nginx-order/fastcgi;
    uwsgi_temp_path       /workspace/docker/nginx-order/uwsgi;
    scgi_temp_path        /workspace/docker/nginx-order/scgi;

    # Biến nhúng ngx_http_upstream_module (xem data/nginx-upstream-vars.js)
    log_format order_upstream
        '$remote_addr - $request '
        'upstream=$upstream_addr '
        'status=$upstream_status '
        'rt=$upstream_response_time '
        'uct=$upstream_connect_time '
        'uht=$upstream_header_time '
        'bytes_r=$upstream_bytes_received '
        'bytes_s=$upstream_bytes_sent '
        'len=$upstream_response_length '
        'cache=$upstream_cache_status';

    upstream order_backend {
        server 127.0.0.1:18081;
        keepalive 8;
    }

    include /workspace/docker/nginx-order/server.conf;
}
