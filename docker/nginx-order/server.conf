# Upstream đơn + token — mọi request nhúng qua nginx ($upstream_*) trước khi
# nạp vào module access_token_rotate / realtime order list.
# Không dump-login.

server {
    listen       127.0.0.1:18080;
    server_name  localhost;

    access_log /workspace/docker/nginx-order/logs/order_access.log order_upstream;
    error_log  /workspace/docker/nginx-order/logs/order_error.log warn;

    # Health (local nginx, không upstream)
    location = /health {
        default_type application/json;
        return 200 '{"ok":true,"service":"nginx-order-embed","routes":["/orders","/v1/token/*","/v1/orders/realtime"]}';
    }

    # —— helper: proxy + nhúng $upstream_* ————————————————————
    # (các location dưới dùng chung pattern)

    location /orders {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
        proxy_pass http://order_backend;

        add_header X-Upstream-Addr            $upstream_addr always;
        add_header X-Upstream-Status          $upstream_status always;
        add_header X-Upstream-Response-Time   $upstream_response_time always;
        add_header X-Upstream-Connect-Time    $upstream_connect_time always;
        add_header X-Upstream-Header-Time     $upstream_header_time always;
        add_header X-Upstream-Bytes-Received  $upstream_bytes_received always;
        add_header X-Upstream-Bytes-Sent      $upstream_bytes_sent always;
        add_header X-Upstream-Response-Length $upstream_response_length always;
        add_header X-Upstream-Cache-Status    $upstream_cache_status always;
        add_header X-Order-Via                "nginx-embed" always;
        add_header X-Pipeline                 "nginx→token-order-upstream" always;
    }

    location /order/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_pass http://order_backend;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
        add_header X-Upstream-Addr $upstream_addr always;
        add_header X-Upstream-Status $upstream_status always;
        add_header X-Upstream-Response-Time $upstream_response_time always;
        add_header X-Order-Via "nginx-embed" always;
        add_header X-Pipeline "nginx→token-order-upstream" always;
    }

    # Access token module — BẮT BUỘC qua nginx trước khi nạp token / gọi đơn RT
    location /v1/token/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Content-Type $content_type;
        proxy_set_header Connection "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 60s;
        proxy_pass http://order_backend;

        add_header X-Upstream-Addr            $upstream_addr always;
        add_header X-Upstream-Status          $upstream_status always;
        add_header X-Upstream-Response-Time   $upstream_response_time always;
        add_header X-Upstream-Connect-Time    $upstream_connect_time always;
        add_header X-Upstream-Header-Time     $upstream_header_time always;
        add_header X-Upstream-Bytes-Received  $upstream_bytes_received always;
        add_header X-Upstream-Bytes-Sent      $upstream_bytes_sent always;
        add_header X-Upstream-Response-Length $upstream_response_length always;
        add_header X-Upstream-Cache-Status    $upstream_cache_status always;
        add_header X-Order-Via                "nginx-embed" always;
        add_header X-Pipeline                 "nginx→access_token_rotate" always;
    }

    # Rà soát → nhúng giá trị sở hữu (shop_id / page_id / token) vào secrets
    location /v1/owned/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Content-Type $content_type;
        proxy_set_header Connection "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 60s;
        proxy_pass http://order_backend;

        add_header X-Upstream-Addr            $upstream_addr always;
        add_header X-Upstream-Status          $upstream_status always;
        add_header X-Upstream-Response-Time   $upstream_response_time always;
        add_header X-Upstream-Connect-Time    $upstream_connect_time always;
        add_header X-Upstream-Header-Time     $upstream_header_time always;
        add_header X-Upstream-Bytes-Received  $upstream_bytes_received always;
        add_header X-Upstream-Bytes-Sent      $upstream_bytes_sent always;
        add_header X-Upstream-Response-Length $upstream_response_length always;
        add_header X-Upstream-Cache-Status    $upstream_cache_status always;
        add_header X-Order-Via                "nginx-embed" always;
        add_header X-Pipeline                 "nginx→owned-fill→secrets" always;
    }

    location = /v1/orders/realtime {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Content-Type $content_type;
        proxy_set_header Connection "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 90s;
        proxy_pass http://order_backend;

        add_header X-Upstream-Addr            $upstream_addr always;
        add_header X-Upstream-Status          $upstream_status always;
        add_header X-Upstream-Response-Time   $upstream_response_time always;
        add_header X-Upstream-Connect-Time    $upstream_connect_time always;
        add_header X-Upstream-Header-Time     $upstream_header_time always;
        add_header X-Upstream-Bytes-Received  $upstream_bytes_received always;
        add_header X-Upstream-Bytes-Sent      $upstream_bytes_sent always;
        add_header X-Upstream-Response-Length $upstream_response_length always;
        add_header X-Upstream-Cache-Status    $upstream_cache_status always;
        add_header X-Order-Via                "nginx-embed" always;
        add_header X-Pipeline                 "nginx→access_token_rotate→realtime" always;
    }

    location = /v1/pancake/ingest {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Content-Type $content_type;
        proxy_set_header Connection "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 180s;
        proxy_pass http://order_backend;

        add_header X-Upstream-Addr            $upstream_addr always;
        add_header X-Upstream-Status          $upstream_status always;
        add_header X-Upstream-Response-Time   $upstream_response_time always;
        add_header X-Order-Via                "nginx-embed" always;
        add_header X-Pipeline                 "nginx→pancake_cookie_ingest→scan" always;
    }

    location = /v1/ghn/ingest {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Content-Type $content_type;
        proxy_set_header Connection "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 60s;
        proxy_pass http://order_backend;

        add_header X-Upstream-Addr            $upstream_addr always;
        add_header X-Upstream-Status          $upstream_status always;
        add_header X-Upstream-Response-Time   $upstream_response_time always;
        add_header X-Order-Via                "nginx-embed" always;
        add_header X-Pipeline                 "nginx→ghn_cookie_ingest" always;
    }

    location = /v1/ghn/token-proxy-orders {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Content-Type $content_type;
        proxy_set_header Connection "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 300s;
        proxy_pass http://order_backend;

        add_header X-Upstream-Addr            $upstream_addr always;
        add_header X-Upstream-Status          $upstream_status always;
        add_header X-Upstream-Response-Time   $upstream_response_time always;
        add_header X-Order-Via                "nginx-embed" always;
        add_header X-Pipeline                 "nginx→token_proxy_bind→ghn_orders" always;
    }

    location /v1/pancake/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 180s;
        proxy_pass http://order_backend;

        add_header X-Order-Via                "nginx-embed" always;
        add_header X-Pipeline                 "nginx→pancake" always;
    }

    location = /v1/buucuc/scan {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Content-Type $content_type;
        proxy_set_header Connection "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 180s;
        proxy_pass http://order_backend;

        add_header X-Upstream-Addr            $upstream_addr always;
        add_header X-Upstream-Status          $upstream_status always;
        add_header X-Upstream-Response-Time   $upstream_response_time always;
        add_header X-Order-Via                "nginx-embed" always;
        add_header X-Pipeline                 "nginx→scan_buucuc_orders" always;
    }

    location /v1/buucuc/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 180s;
        proxy_pass http://order_backend;

        add_header X-Order-Via                "nginx-embed" always;
        add_header X-Pipeline                 "nginx→buucuc" always;
    }

    location = /orders/buucuc {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 60s;
        proxy_pass http://order_backend;

        add_header X-Order-Via                "nginx-embed" always;
        add_header X-Pipeline                 "nginx→buucuc_scan_cache" always;
    }

    location /v1/orders/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 180s;
        proxy_pass http://order_backend;

        add_header X-Upstream-Addr            $upstream_addr always;
        add_header X-Upstream-Status          $upstream_status always;
        add_header X-Upstream-Response-Time   $upstream_response_time always;
        add_header X-Upstream-Connect-Time    $upstream_connect_time always;
        add_header X-Upstream-Header-Time     $upstream_header_time always;
        add_header X-Upstream-Bytes-Received  $upstream_bytes_received always;
        add_header X-Upstream-Bytes-Sent      $upstream_bytes_sent always;
        add_header X-Upstream-Response-Length $upstream_response_length always;
        add_header X-Upstream-Cache-Status    $upstream_cache_status always;
        add_header X-Order-Via                "nginx-embed" always;
        add_header X-Pipeline                 "nginx→orders/buucuc" always;
    }

    location / {
        default_type text/plain;
        return 200 "nginx-order-embed · /orders · /orders/buucuc · /v1/token/* · /v1/pancake/ingest · /v1/ghn/ingest · /v1/buucuc/scan · /v1/orders/* · /health\n";
    }
}
